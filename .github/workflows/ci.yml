name: DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: docker build -t devops-blog:${{ github.sha }} .

      # 3. Run container (backend test)
      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name app devops-blog:${{ github.sha }}
          sleep 10

      # 4. Healthcheck test (REAL DEVOPS TEST)
      - name: Test health endpoint
        run: |
          curl -f http://localhost:5000/health

      # 5. Cleanup
      - name: Cleanup
        if: always()
        run: docker rm -f app
